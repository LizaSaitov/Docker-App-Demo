apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
    
  labels:
    app: {{ .Release.Name }}
spec:
  selector: 
    matchLabels:
      app: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.pods.image }}:{{ .Values.pods.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetport }}
