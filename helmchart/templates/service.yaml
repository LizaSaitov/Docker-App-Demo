kind: Service
apiVersion: v1     
metadata:
  name:  {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}    
  type:  {{ .Values.service.type }}
  ports:         
  - name: http   
    protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetport }}

